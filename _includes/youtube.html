<div style="max-width: {{ include.max_width | default: '640px' }}; margin-bottom: 40px">
  <div style="position: relative; padding-top: {{ include.ratio | default: '56.25%' }}">
    <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}" title="{{ include.title | escape }}" loading="lazy" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%"></iframe>
  </div>
</div>
