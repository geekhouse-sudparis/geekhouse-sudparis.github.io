# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-llms
  - jekyll-structured-content

# jekyll-llms: /llms.txt indexes page descriptions and links to a Markdown copy of each page.
llms:
  exclude:
    - /README.md
    - /404.html
    - /assets/**
    - /feed.xml
    - /sitemap.xml
    - /robots.txt

header_pages:
  - rooms.md
  - about.md
  - faq.md
  - contact.md

show_excerpts: true

defaults:
  - scope:
      path: ""
    values:
      image: /assets/living-001.jpg

# minima 2.5 uses Sass syntax that Dart Sass deprecates; the warnings come from the theme, not this site.
sass:
  style: compressed
  sourcemap: never
  quiet_deps: true
  silence_deprecations:
    - import

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
